<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Book Appointment | Vardaan Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        /* Top Bar */
        .top-bar { background-color: #b71c1c; color: white; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; letter-spacing: 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(255, 255, 255, 0.98); box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000;}
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-img-wrapper { width: 60px; height: 60px; background-color: white; border: 3px solid #d32f2f; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: 0 4px 8px rgba(211,47,47,0.2);}
        .nav-menu { display: flex; gap: 30px; }
        .nav-menu a { text-decoration: none; color: #444; font-weight: 600; font-size: 15px; padding-bottom: 5px; position: relative; transition: color 0.3s;}
        .nav-menu a:hover { color: #d32f2f; }
        .nav-menu a.active { color: #d32f2f; border-bottom: 2px solid #d32f2f;}
        
        /* Appointment Section */
        .appointment-wrapper { display: flex; justify-content: center; padding: 60px 5%; background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); min-height: 80vh; align-items: center;}
        .form-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 100%; max-width: 650px; border-top: 6px solid #d32f2f;}
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h2 { font-size: 28px; color: #111; font-weight: 800; margin-bottom: 10px;}
        .form-header p { color: #666; font-size: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: 15px;}
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 15px; transition: border 0.3s; background: #f9f9f9;}
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #1565C0; background: white; box-shadow: 0 0 8px rgba(21,101,192,0.1);}
        
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        
        .submit-btn { width: 100%; background: #d32f2f; color: white; padding: 16px; border: none; border-radius: 30px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 8px 15px rgba(211,47,47,0.3);}
        .submit-btn:hover { background: #b71c1c; transform: translateY(-3px); box-shadow: 0 12px 20px rgba(211,47,47,0.4);}
        
        .footer { background-color: #111; color: white; text-align: center; padding: 20px; }
        
        @media (max-width: 768px) {
            .row { flex-direction: column; gap: 0; }
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <i class="fa-solid fa-phone-volume"></i> EMERGENCY & APPOINTMENT: +91 08922940607
    </div>

    <header class="header">
        <div class="logo">
            <div class="logo-img-wrapper">
                <img src="assets/images/logo.jpg" alt="Vardaan Logo" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div>
                <h2 style="color:#d32f2f; font-size:28px; margin:0; line-height:1; font-weight: 800; text-transform: uppercase;">Vardaan Hospital</h2>
                <p style="font-size:12px; margin:3px 0 0 0; letter-spacing:1.5px; font-weight: 600; color: #555; text-transform: uppercase;">Trauma & Diagnostic Center</p>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="index.html#about-dr">About Dr. Singh</a>
            <a href="index.html#services">Specialities</a>
            <a href="appointment.html" class="active">Appointments</a>
        </nav>
    </header>

    <div class="appointment-wrapper">
        <div class="form-container">
            <div class="form-header">
                <h2>Book an Appointment</h2>
                <p>Please fill out the form below and our team will confirm your slot.</p>
            </div>
            
            <form action="#" method="POST" onsubmit="alert('Thank you! Your appointment request has been received.'); return false;">
                <div class="row">
                    <div class="col form-group">
                        <label>Patient Name (मरीज़ का नाम) *</label>
                        <input type="text" placeholder="Enter Full Name" required>
                    </div>
                    <div class="col form-group">
                        <label>Mobile Number (मोबाइल नंबर) *</label>
                        <input type="tel" placeholder="10-digit Mobile Number" required pattern="[0-9]{10}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Address (पता) *</label>
                    <input type="text" placeholder="City, Village, or Full Address" required>
                </div>
                
                <div class="row">
                    <div class="col form-group">
                        <label>Date of Appointment (तारीख) *</label>
                        <input type="date" required>
                    </div>
                    <div class="col form-group">
                        <label>Department (विभाग)</label>
                        <select>
                            <option>Orthopaedics (हड्डी रोग)</option>
                            <option>Trauma Care (चोट/आपातकाल)</option>
                            <option>Spinal Surgery (रीढ़ की हड्डी)</option>
                            <option>General Checkup (सामान्य जांच)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Briefly describe the problem (बीमारी/समस्या लिखें)</label>
                    <textarea rows="3" placeholder="e.g. Knee pain, Back ache, etc."></textarea>
                </div>
                
                <button type="submit" class="submit-btn"><i class="fa-solid fa-check-circle"></i> Confirm Appointment</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Vardaan Hospital. All Rights Reserved.</p>
    </div>

</body>
</html>
